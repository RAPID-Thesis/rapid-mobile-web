# Google Cloud Build — build backend image for Cloud Run (no local Docker).
#
# ML binaries (*.keras, *.joblib) are .gitignored — `gcloud builds submit` will NOT upload them
# unless they are tracked (e.g. `git add -f ml/artifacts/*` on a deploy branch) or you copy
# artifacts into the tree another way. Otherwise the image builds but inference may fail.
#
# Prereqs (once per project):
#   gcloud config set project YOUR_PROJECT_ID
#   gcloud services enable cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com
#   gcloud artifacts repositories create ${_AR_REPO} --repository-format=docker --location=${_REGION}
#
# IAM: Cloud Build default SA needs Artifact Registry Writer on the project:
#   PROJECT_NUMBER=$(gcloud projects describe YOUR_PROJECT_ID --format='value(projectNumber)')
#   gcloud projects add-iam-policy-binding YOUR_PROJECT_ID \
#     --member="serviceAccount:${PROJECT_NUMBER}@cloudbuild.gserviceaccount.com" \
#     --role="roles/artifactregistry.writer"
#
# Submit build from repo root (uploads source tarball; ml/artifacts must be in repo or use Cloud Storage — see README in repo):
#   gcloud builds submit --config=cloudbuild.yaml --substitutions=_REGION=asia-southeast1 .
#
# Substitutions (override any):
#   _REGION     — Artifact Registry + Run region (e.g. asia-southeast1, us-central1)
#   _AR_REPO    — Docker repo name in Artifact Registry
#   _IMAGE      — Image name

substitutions:
  _REGION: asia-southeast1
  _AR_REPO: rapid
  _IMAGE: rapid-api

timeout: 2400s

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${BUILD_ID}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
